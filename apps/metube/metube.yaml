apiVersion: v1
kind: Namespace
metadata:
  name: metube
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metube
  namespace: metube
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate          # never run two copies writing the same folder
  selector:
    matchLabels:
      app: metube
  template:
    metadata:
      labels:
        app: metube
    spec:
      containers:
        - name: metube
          image: docker.io/alexta69/metube@sha256:c423654da5b9d29b02a8092713607b906d63d17fd7e0a2f52228218a0d3e2a7b
          ports:
            - containerPort: 8081
          env:
            - name: TZ
              value: America/Los_Angeles
            - name: DELETE_FILE_ON_TRASHCAN
              value: "true"
            - name: YTDL_OPTIONS
              value: '{"download_archive":"/downloads/.metube/music-download-archive.txt"}'
          volumeMounts:
            - name: downloads
              mountPath: /downloads
      volumes:
        - name: downloads
          hostPath:
            path: /mnt/media/music-staging
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: metube
  namespace: metube
spec:
  type: NodePort
  selector:
    app: metube
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
